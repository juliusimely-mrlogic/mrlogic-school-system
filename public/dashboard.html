<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashibodi - M-Logic</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f3f4f6; margin: 0; color: #333; }
    .navbar { background: #1e3a8a; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .navbar h1 { margin: 0; font-size: 20px; }
    .navbar .btn-logout { background: #ef4444; color: white; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; }
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .page-title { color: #1e3a8a; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #3b82f6; }
    .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; }
    .card .value { font-size: 32px; font-weight: bold; color: #1f2937; margin: 0; }
    .card.blue { border-left-color: #3b82f6; }
    .card.green { border-left-color: #10b981; }
    .card.orange { border-left-color: #f59e0b; }
    .card.red { border-left-color: #ef4444; }
    .card.purple { border-left-color: #8b5cf6; }
    .card.teal { border-left-color: #14b8a6; }
    
    /* Kadi ya Nafasi ya Shule */
    .rank-card { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; border: none; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 25px; }
    .rank-card h3 { color: #bfdbfe; margin-bottom: 5px; }
    .rank-card .rank-value { font-size: 48px; font-weight: 900; line-height: 1; margin: 10px 0; }
    .rank-card .rank-sub { font-size: 14px; color: #e0e7ff; }
    #loading { text-align: center; font-size: 18px; color: #6b7280; padding: 50px; display: none; }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>M-Logic School System</h1>
    <a href="#" id="logout-btn" class="btn-logout">Toka (Logout)</a>
  </div>

  <div class="container">
    <h2 class="page-title" id="school-name">Inapakia Takwimu...</h2>
    <div id="loading">Inapakia data kutoka kwenye mfumo...</div>

    <div class="stats-grid" id="stats-container" style="display: none;">
      
      <!-- Kadi ya Nafasi ya Shule (Halmashauri) -->
      <div class="card rank-card">
        <h3>Nafasi ya Shule</h3>
        <div class="rank-value" id="district-rank">-</div>
        <div class="rank-sub">Kati ya Shule <span id="total-schools">0</span> (Halmashauri)</div>
      </div>

      <!-- Kadi za Kawaida -->
      <div class="card blue">
        <h3>Jumla ya Wanafunzi</h3>
        <p class="value" id="total-students">0</p>
      </div>
      <div class="card green">
        <h3>Jumla ya Walimu</h3>
        <p class="value" id="total-teachers">0</p>
      </div>
      <div class="card purple">
        <h3>Madarasa (Streams)</h3>
        <p class="value" id="total-classes">0</p>
      </div>
      <div class="card teal">
        <h3>Ada Iliyokusanywa</h3>
        <p class="value" id="collected-fees">Tsh 0</p>
      </div>
      <div class="card red">
        <h3>Madeni ya Ada</h3>
        <p class="value" id="outstanding-fees">Tsh 0</p>
      </div>
    </div>
  </div>

  <!-- Unganisha faili la JavaScript hapa -->
  <script src="/dashboard.js"></script>
</body>
</html>
