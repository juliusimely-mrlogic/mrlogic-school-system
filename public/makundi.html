<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><title>Makundi ya Masomo</title>
<style>body{font-family:sans-serif;background:#f3f4f6;padding:20px;} .container{max-width:1000px;margin:auto;background:#fff;padding:20px;border-radius:8px;} .header{display:flex;justify-content:space-between;margin-bottom:20px;} table{width:100%;border-collapse:collapse;margin-top:15px;} th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;} select{padding:8px;margin-right:10px;} .btn{background:#2563eb;color:#fff;padding:10px 15px;border-radius:4px;border:none;cursor:pointer;text-decoration:none;}</style></head>
<body><div class="container"><div class="header"><h2>Makundi ya Masomo (Top 40)</h2><a href="/" class="btn">⬅️ Rudi</a></div>
<div style="margin-bottom:15px;">
<select id="exam"></select><select id="stream"><option value="">Madarasa Yote</option></select>
<select id="cluster"><option value="science">Sayansi (Science)</option><option value="business">Biashara (Business)</option><option value="arts">Sanaa (Arts)</option></select>
<button class="btn" onclick="loadData()">Pakia</button></div>
<table><thead><tr><th>Nafasi</th><th>Jina la Mwanafunzi</th><th>Darasa</th><th>Wastani</th></tr></thead><tbody id="tbl"></tbody></table></div>
<script>
const token=localStorage.getItem('token'); const h={'Authorization':`Bearer ${token}`};
async function init(){ const [e,s]=await Promise.all([fetch('/api/exams',{headers:h}),fetch('/api/streams',{headers:h})]); const E=await e.json(),S=await s.json(); document.getElementById('exam').innerHTML=E.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''); document.getElementById('stream').innerHTML+=(S.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')); }
window.loadData=async()=>{
  const res=await fetch(`/api/reports/cluster-top-students?exam_id=${exam.value}&stream_id=${stream.value}&cluster=${cluster.value}`,{headers:h}); 
  if(!res.ok) return alert("API ya makundi haijaruhusiwa kwenye server yako kwa sasa.");
  const d=await res.json();
  document.getElementById('tbl').innerHTML=d.reportData.map(r=>`<tr><td>${r.rank}</td><td>${r.full_name}</td><td>${r.stream_name}</td><td><strong>${r.average}</strong></td></tr>`).join('');
};
init();
</script></body></html>
