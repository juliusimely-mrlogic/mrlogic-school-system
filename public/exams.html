<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><title>Kuingiza Alama</title>
<style>body{font-family:sans-serif;background:#f3f4f6;padding:20px;} .container{max-width:1000px;margin:auto;background:#fff;padding:20px;border-radius:8px;} .header{display:flex;justify-content:space-between;margin-bottom:20px;} .tabs{display:flex;gap:10px;margin-bottom:20px;} .tab{background:#e5e7eb;padding:10px;cursor:pointer;border-radius:4px;} .tab.active{background:#2563eb;color:#fff;} .form-row{display:flex;gap:10px;margin-bottom:15px;} .form-row select,.form-row button{flex:1;padding:10px;} table{width:100%;border-collapse:collapse;} th,td{padding:10px;border-bottom:1px solid #ddd;} input[type="number"]{width:80px;padding:5px;} .btn{background:#2563eb;color:#fff;padding:10px 15px;border-radius:4px;border:none;cursor:pointer;width:100%;margin-top:10px;}</style></head>
<body><div class="container"><div class="header"><h2>Kuingiza Alama</h2><a href="/" class="btn" style="width:auto;">⬅️ Rudi</a></div>
<div class="tabs"><div class="tab active" onclick="switchTab('manual')">Andika kwa Mkono</div><div class="tab" onclick="switchTab('excel')">Pakia Excel</div></div>
<div id="manual" style="display:block;"><div class="form-row"><select id="m-exam"></select><select id="m-subj"></select><select id="m-stream"></select><button onclick="loadStudents()" class="btn" style="margin:0;">Pakia</button></div>
<table><thead><tr><th>#</th><th>Jina</th><th>Alama</th></tr></thead><tbody id="m-tbl"></tbody></table><button class="btn" id="saveBtn" style="display:none;" onclick="saveMarks()">Hifadhi Alama</button></div>
<div id="excel" style="display:none;"><a href="#" id="dlTemp" class="btn" style="display:block;text-align:center;margin-bottom:20px;background:#f59e0b;">Pakua Template</a><div class="form-row"><select id="e-exam"></select><select id="e-stream"></select></div><input type="file" id="e-file" style="margin-bottom:10px;"><button class="btn" onclick="uploadExcel()">Pakia Matokeo</button></div>
</div>
<script>
const token=localStorage.getItem('token'); const h={'Authorization':`Bearer ${token}`};
function switchTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));event.target.classList.add('active');document.getElementById('manual').style.display=id==='manual'?'block':'none';document.getElementById('excel').style.display=id==='excel'?'block':'none';}
async function init(){
  const [ex,su,st]=await Promise.all([fetch('/api/exams',{headers:h}),fetch('/api/subjects',{headers:h}),fetch('/api/streams',{headers:h})]);
  const E=await ex.json(),S=await su.json(),ST=await st.json();
  const exOpt=E.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''); const stOpt=ST.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
  document.getElementById('m-exam').innerHTML=exOpt; document.getElementById('e-exam').innerHTML=exOpt;
  document.getElementById('m-subj').innerHTML=S.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
  document.getElementById('m-stream').innerHTML=stOpt; document.getElementById('e-stream').innerHTML=stOpt;
  document.getElementById('dlTemp').href=`/api/results/excel-template?token=${token}`;
}
window.loadStudents=async()=>{
  const e=m_exam.value,s=m_subj.value,st=m_stream.value; if(!e||!s||!st)return alert('Chagua vitu vyote');
  const [r1,r2]=await Promise.all([fetch(`/api/students?stream_id=${st}`,{headers:h}),fetch(`/api/results/existing?exam_id=${e}&subject_id=${s}&stream_id=${st}`,{headers:h})]);
  const studs=await r1.json(),res=await r2.json(); const map={}; res.forEach(r=>map[r.student_id]=r.score);
  document.getElementById('m-tbl').innerHTML=studs.map((x,i)=>`<tr><td>${i+1}</td><td>${x.full_name}</td><td><input type="number" class="score" data-id="${x.id}" value="${map[x.id]||''}"></td></tr>`).join('');
  document.getElementById('saveBtn').style.display='block';
};
window.saveMarks=async()=>{
  const marks=[...document.querySelectorAll('.score')].map(i=>({student_id:i.getAttribute('data-id'),score:i.value}));
  await fetch('/api/results',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({exam_id:m_exam.value,subject_id:m_subj.value,marks})}); alert('Zimehifadhiwa');
};
window.uploadExcel=async()=>{
  if(!e_file.files[0]) return alert('Pakia faili'); const fd=new FormData(); fd.append('exam_id',e_exam.value); fd.append('stream_id',e_stream.value); fd.append('file',e_file.files[0]);
  const res=await fetch('/api/results/upload-excel',{method:'POST',headers:h,body:fd}); const d=await res.json(); alert(d.message||d.error);
};
init();
</script></body></html>
