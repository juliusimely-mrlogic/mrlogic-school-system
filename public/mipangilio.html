<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><title>Mipangilio</title>
<style>body{font-family:sans-serif;background:#f3f4f6;padding:20px;} .container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:8px;} .header{display:flex;justify-content:space-between;margin-bottom:20px;} .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;} input{padding:8px;width:100%;box-sizing:border-box;margin-bottom:10px;} .btn{background:#2563eb;color:#fff;padding:10px;border-radius:4px;border:none;cursor:pointer;width:100%;} ul{list-style:none;padding:0;} li{padding:8px;background:#f9fafb;border-bottom:1px solid #eee;}</style></head>
<body><div class="container"><div class="header"><h2>Mipangilio ya Shule</h2><a href="/" class="btn" style="width:auto;">⬅️ Rudi</a></div>
<div class="grid">
<div><h3>Madarasa (Streams)</h3><input type="text" id="streamName" placeholder="Jina la Darasa"><input type="number" id="streamFee" placeholder="Ada (Tsh)"><button class="btn" onclick="addStream()">Ongeza Darasa</button><ul id="streamList"></ul></div>
<div><h3>Masomo (Subjects)</h3><input type="text" id="subjName" placeholder="Jina la Somo"><button class="btn" onclick="addSubject()">Ongeza Somo</button><ul id="subjList"></ul></div>
<div><h3>Mitihani (Exams)</h3><input type="text" id="examName" placeholder="Jina la Mtihani"><button class="btn" onclick="addExam()">Ongeza Mtihani</button><ul id="examList"></ul></div>
</div></div>
<script>
const token=localStorage.getItem('token'); const h={'Authorization':`Bearer ${token}`,'Content-Type':'application/json'};
async function load(){ 
  const [s,su,e]=await Promise.all([fetch('/api/streams',{headers:h}),fetch('/api/subjects',{headers:h}),fetch('/api/exams',{headers:h})]); 
  document.getElementById('streamList').innerHTML=(await s.json()).map(x=>`<li>${x.name} - ${x.fee_amount}</li>`).join(''); 
  document.getElementById('subjList').innerHTML=(await su.json()).map(x=>`<li>${x.name}</li>`).join(''); 
  document.getElementById('examList').innerHTML=(await e.json()).map(x=>`<li>${x.name}</li>`).join(''); 
}
window.addStream=async()=>{ await fetch('/api/streams',{method:'POST',headers:h,body:JSON.stringify({name:streamName.value,fee_amount:streamFee.value})}); load(); };
window.addSubject=async()=>{ await fetch('/api/subjects',{method:'POST',headers:h,body:JSON.stringify({name:subjName.value})}); load(); };
window.addExam=async()=>{ await fetch('/api/exams',{method:'POST',headers:h,body:JSON.stringify({name:examName.value})}); load(); };
load();
</script></body></html>
