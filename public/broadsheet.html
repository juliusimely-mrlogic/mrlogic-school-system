<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><title>Broadsheet</title>
<style>body{font-family:sans-serif;background:#f3f4f6;padding:20px;} .container{max-width:1200px;margin:auto;background:#fff;padding:20px;border-radius:8px;} .header{display:flex;justify-content:space-between;margin-bottom:20px;} table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px;text-align:center;} th,td{padding:8px;border:1px solid #ddd;} th{background:#f9fafb;} select{padding:8px;margin-right:10px;} .btn{background:#2563eb;color:#fff;padding:10px 15px;border-radius:4px;border:none;cursor:pointer;text-decoration:none;}</style></head>
<body><div class="container"><div class="header"><h2>Broadsheet</h2><a href="/" class="btn">⬅️ Rudi</a></div>
<div style="margin-bottom:15px;"><select id="exam"></select><select id="stream"></select><button class="btn" onclick="loadData()">Pakia Matokeo</button></div>
<div style="overflow-x:auto;"><table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div>
<script>
const token=localStorage.getItem('token'); const h={'Authorization':`Bearer ${token}`};
async function init(){ const [e,s]=await Promise.all([fetch('/api/exams',{headers:h}),fetch('/api/streams',{headers:h})]); const E=await e.json(),S=await s.json(); document.getElementById('exam').innerHTML=E.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''); document.getElementById('stream').innerHTML=S.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''); }
window.loadData=async()=>{
  const res=await fetch(`/api/reports/broadsheet?exam_id=${exam.value}&stream_id=${stream.value}`,{headers:h}); const d=await res.json();
  document.getElementById('thead').innerHTML=`<tr><th>NAFASI</th><th>JINA</th>${d.subjects.map(s=>`<th>${s.name.substring(0,3).toUpperCase()}</th>`).join('')}<th>JUMLA</th><th>WASTANI</th><th>DIV</th></tr>`;
  document.getElementById('tbody').innerHTML=d.reportData.map(r=>`<tr><td>${r.position}</td><td style="text-align:left;">${r.full_name}</td>${d.subjects.map(s=>`<td>${r.scores[s.id]?.score||'-'} (${r.scores[s.id]?.grade||'-'})</td>`).join('')}<td><strong>${r.total}</strong></td><td>${r.average}</td><td><strong>${r.division}</strong></td></tr>`).join('');
};
init();
</script></body></html>
