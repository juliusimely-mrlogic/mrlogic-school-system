<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><title>Kupanga Walimu</title>
<style>body{font-family:sans-serif;background:#f3f4f6;padding:20px;} .container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:8px;} .header{display:flex;justify-content:space-between;margin-bottom:20px;} select{padding:8px;margin:5px 0;width:100%;box-sizing:border-box;} .btn{background:#2563eb;color:#fff;padding:10px 15px;border-radius:4px;border:none;cursor:pointer;}</style></head>
<body><div class="container"><div class="header"><h2>Kupanga Walimu</h2><a href="/" class="btn">⬅️ Rudi</a></div>
<form id="frm"><select id="teacher" required></select><select id="stream" required></select><select id="subject" required></select><button class="btn" type="submit">Gawa Somo</button></form>
<table style="width:100%;margin-top:20px;border-collapse:collapse;"><thead><tr style="background:#eee;"><th>Mwalimu</th><th>Darasa</th><th>Somo</th></tr></thead><tbody id="tbl"></tbody></table></div>
<script>
const token=localStorage.getItem('token'); const h={'Authorization':`Bearer ${token}`,'Content-Type':'application/json'};
async function load(){ 
  const [t,st,su,a]=await Promise.all([fetch('/api/teachers',{headers:h}),fetch('/api/streams',{headers:h}),fetch('/api/subjects',{headers:h}),fetch('/api/assignments',{headers:h})]); 
  const T=await t.json(), S=await st.json(), SU=await su.json(), A=await a.json();
  teacher.innerHTML=T.map(x=>`<option value="${x.id}">${x.full_name}</option>`).join('');
  stream.innerHTML=S.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
  subject.innerHTML=SU.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
  document.getElementById('tbl').innerHTML=A.map(x=>`<tr><td>${x.teacher_name}</td><td>${x.stream_name}</td><td>${x.subject_name}</td></tr>`).join('');
}
document.getElementById('frm').onsubmit=async(e)=>{e.preventDefault(); await fetch('/api/assignments',{method:'POST',headers:h,body:JSON.stringify({teacher_id:teacher.value,stream_id:stream.value,subject_id:subject.value})}); load();};
load();
</script></body></html>
