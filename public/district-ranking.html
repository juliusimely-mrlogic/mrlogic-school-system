<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafasi ya Shule (Halmashauri) - MR-LOGIC</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
        .navbar { background-color: #1e3a8a; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin-right: 20px; background: #3b82f6; padding: 8px 15px; border-radius: 4px; }
        .container { padding: 30px; max-width: 1200px; margin: auto; }
        
        .header-title { text-align: center; margin-bottom: 30px; }
        .header-title h2 { color: #1e3a8a; margin: 0; font-size: 28px; }
        .header-title p { color: #666; font-size: 18px; margin-top: 5px; }

        /* Kadi za Nafasi */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { padding: 20px; border-radius: 8px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .stat-card h4 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; opacity: 0.9; }
        .stat-card h2 { margin: 0; font-size: 28px; }
        .stat-card p { margin: 5px 0 0 0; font-size: 14px; font-weight: bold;}
        .bg-blue { background-color: #3b82f6; }
        .bg-green { background-color: #10b981; }
        .bg-red { background-color: #ef4444; }

        .btn-print { padding: 10px 20px; background: #1e3a8a; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-bottom: 20px; float: right;}
        
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; font-size: 13px; }
        th, td { padding: 10px; text-align: center; border: 1px solid #e5e7eb; }
        th { background-color: #1e3a8a; color: white; font-weight: bold; text-transform: uppercase; font-size: 12px;}
        td:nth-child(2) { text-align: left; font-weight: bold; }
        td:nth-child(10) { text-align: left; font-size: 12px; }
        tr:nth-child(even) { background-color: #f8fafc; }
        
        .pos-col { background-color: #fef08a; font-weight: bold; }
        .subject-badge { display: inline-block; margin: 2px; padding: 2px 6px; border-radius: 4px; background: #e5e7eb; font-weight: bold; font-size: 11px; }

        @media print {
            @page { size: landscape; margin: 10mm; }
            body { background: white; }
            .navbar, .btn-print { display: none !important; }
            .container { padding: 0; max-width: 100%; }
            table { box-shadow: none; border-radius: 0; font-size: 10px; }
            th { background-color: #ddd !important; color: black !important; border: 1px solid #000; }
            td { border: 1px solid #000; }
            tr:nth-child(even) { background-color: transparent; }
            .pos-col { background-color: transparent !important; }
            .subject-badge { background: transparent; border: 1px solid #000; }
            .stat-card { border: 1px solid #000; color: black !important; background: transparent !important; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div>
            <a href="/index.html">&larr; Rudi Dashibodi</a>
            <span style="font-size: 20px; font-weight: bold;">Nafasi ya Shule (Halmashauri)</span>
        </div>
        <div>
            <button onclick="logout()" style="padding: 8px 15px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Toka</button>
        </div>
    </div>

    <div class="container">
        <div class="header-title" id="district-title">
            <h2>Inapakia Halmashauri...</h2>
        </div>

        <div class="stats-grid" id="stats-container">
            <!-- Itajazwa na JS -->
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="color: #1e3a8a; margin: 0;">Wanafunzi 20 Bora wa Halmashauri</h3>
            <button class="btn-print" onclick="window.print()">Chapisha (Print)</button>
        </div>

        <div id="report-container">
            <p style="text-align: center; color: #666;">Inapakia data...</p>
        </div>
    </div>

    <script src="district-ranking.js"></script>
</body>
</html>
