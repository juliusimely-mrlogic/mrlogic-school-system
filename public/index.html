<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MR-LOGIC School System</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f3f4f6; margin: 0; color: #333; overflow-x: hidden; }
    
    /* Login Screen */
    #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: #1e3a8a; }
    .login-box { background: white; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .login-box h2 { text-align: center; color: #1e3a8a; margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
    .login-box button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    
    /* App Layout */
    #app-screen { display: none; height: 100vh; flex-direction: column; }
    .navbar { background: #1e3a8a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .navbar h1 { margin: 0; font-size: 20px; }
    .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    
    .main-wrapper { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 260px; background: #1f2937; color: white; overflow-y: auto; padding: 10px 0; }
    .sidebar a { display: block; padding: 12px 20px; color: #d1d5db; text-decoration: none; font-size: 15px; border-left: 4px solid transparent; cursor: pointer; transition: 0.2s; }
    .sidebar a:hover, .sidebar a.active { background: #374151; color: white; border-left-color: #3b82f6; }
    
    .content-area { flex: 1; padding: 20px; overflow-y: auto; background: #f3f4f6; }
    
    /* Shared Styles */
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
    th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th { background: #f9fafb; font-weight: 600; }
    input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; margin-bottom: 10px; }
    .btn-primary { background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-green { background: #16a34a; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-save-light { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-save-light:hover { background: #c3e6cb; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { padding: 20px; border-radius: 8px; color: white; text-align: center; }
    .stat-card h3 { margin: 0; font-size: 14px; opacity: 0.9; }
    .stat-card .val { font-size: 28px; font-weight: bold; margin: 5px 0 0; }
    .grid-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .chart-box { background: white; padding: 15px; border-radius: 8px; }

    /* KADI ZA HALMASHAURI */
    .district-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
    .district-card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; border-top: 4px solid #8b5cf6; display: flex; flex-direction: column; }
    .district-header { background: #f8fafc; padding: 15px; border-bottom: 1px solid #e2e8f0; }
    .district-header h3 { margin: 0; color: #1e293b; font-size: 16px; }
    .district-header p { margin: 5px 0 0; font-size: 13px; color: #64748b; }
    .school-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; flex: 1; }
    .school-item { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .school-item:last-child { border-bottom: none; }
    .school-name { font-weight: 500; color: #334155; font-size: 14px; }
    .school-students { background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }

    /* KADI ZA MALIPO YA MFUMO */
    .payment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .payment-box { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .payment-box h4 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .list-group { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; }
    .list-item { padding: 10px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
    .list-item:last-child { border-bottom: none; }
    .badge-paid { background: #dcfce7; color: #166534; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-unpaid { background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; border: none; color: white; }

    /* Fomu na Vichupo */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: #4b5563; }
    .tabs { display: flex; border-bottom: 2px solid #e5e7eb; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #6b7280; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #1e3a8a; border-bottom: 3px solid #1e3a8a; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <h2>MR-LOGIC Login</h2>
      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="login()">Ingia Mfumo</button>
      <p id="login-msg" style="color:red; text-align:center; margin-top:10px; font-size:14px;"></p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app-screen">
    <div class="navbar">
      <h1>MR-LOGIC Dashibodi</h1>
      <button class="btn-logout" onclick="logout()">Toka (Logout)</button>
    </div>
    
    <div class="main-wrapper">
      <div class="sidebar">
        <a onclick="navigate('dashboard')" class="nav-link active" id="nav-dashboard">📊 Dashibodi</a>
        <a onclick="navigate('kusajili_shule')" class="nav-link" id="nav-kusajili_shule" style="display: none;">🏫 Kusajili Shule</a>
        <a onclick="navigate('wanafunzi')" class="nav-link" id="nav-wanafunzi">👨‍🎓 Wanafunzi</a>
        <a onclick="navigate('walimu')" class="nav-link" id="nav-walimu">👨‍🏫 Walimu</a>
        <a onclick="navigate('ada')" class="nav-link" id="nav-ada">💰 Ada & Malipo</a>
        <a onclick="navigate('alama')" class="nav-link" id="nav-alama">📝 Kuingiza Alama</a>
        <a onclick="navigate('broadsheet')" class="nav-link" id="nav-broadsheet">📄 Broadsheet</a>
        <a onclick="navigate('mahudhurio')" class="nav-link" id="nav-mahudhurio">✅ Mahudhurio</a>
        <a onclick="navigate('kupanga')" class="nav-link" id="nav-kupanga">🗂️ Kupanga Walimu</a>
        <a onclick="navigate('ripoti')" class="nav-link" id="nav-ripoti">🏆 Wanafunzi Bora & Wabovu</a>
        <a onclick="navigate('mipangilio')" class="nav-link" id="nav-mipangilio">⚙️ Mipangilio</a>
      </div>

      <div class="content-area" id="content-area">
        <!-- Dynamic Content Here -->
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
