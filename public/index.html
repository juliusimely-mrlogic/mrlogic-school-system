<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR-LOGIC School System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="screen active" style="display: flex;">
        <div class="login-box">
            <h2>MR-LOGIC</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="login-btn">Ingia Mfumoni</button>
            </form>
            <div id="login-error" class="error-msg" style="color:red;"></div>
        </div>
    </div>

    <div id="dashboard-screen" class="screen" style="display: none;">
        <header>
            <h1>Dashibodi ya MR-LOGIC</h1>
            <div class="header-user">
                <span id="welcome-msg">Karibu!</span>
                <button id="logout-btn" class="btn-red">Toka</button>
            </div>
        </header>
        
        <main>
            <div class="school-selector-container" style="margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px;">
                <label><strong>Chagua Shule: </strong></label>
                <select id="school-selector" style="padding: 8px; font-size: 16px;">
                    <option value="">-- Chagua Shule --</option>
                </select>
                <button onclick="toggleSchoolForm()" class="btn-green" style="padding: 8px 15px; margin-left: 10px; border:none; color:white; cursor:pointer;">+ Sajili Shule</button>
            </div>

            <div class="cards">
                <div class="card" onclick="showSection('students')"><h3>Wanafunzi</h3><p>Simamia wanafunzi</p></div>
                <div class="card" onclick="showSection('classes')"><h3>Madarasa</h3><p>Angalia madarasa</p></div>
                <div class="card" onclick="showSection('exams')" style="border-color: #e67e22;"><h3>Mitihani</h3><p>Ingiza na chakata matokeo</p></div>
            </div>

            <!-- SEHEMU YA MITIHANI NA BROADSHEET -->
            <div id="exams-section" class="section-container" style="display: none;">
                <h2>Mitihani & Matokeo</h2>
                
                <div style="background: #fdf2e9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <h3>Ingiza Alama</h3>
                    <form id="add-marks-form" class="form-row">
                        <select id="marks-exam" required><option value="">-- Mtihani --</option></select>
                        <select id="marks-student" required><option value="">-- Mwanafunzi --</option></select>
                        <select id="marks-subject" required><option value="">-- Somo --</option></select>
                        <input type="number" id="marks-score" placeholder="Alama (0-100)" min="0" max="100" required>
                        <button type="submit" class="btn-blue">Hifadhi Alama</button>
                    </form>
                </div>

                <div style="background: #e0f7fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <h3>Chakata Matokeo (NECTA Format)</h3>
                    <div class="form-row">
                        <select id="process-exam-select" required><option value="">-- Chagua Mtihani Kuchakata --</option></select>
                        <button onclick="loadBroadsheet()" class="btn-blue">Vuta Matokeo (Broadsheet)</button>
                        <button onclick="window.print()" class="btn-green">Chapisha Broadsheet</button>
                    </div>
                </div>

                <!-- ENEO LA BROADSHEET (Linaonekana hapa na kwenye Print) -->
                <div id="broadsheet-container" style="display: none;">
                    <div class="broadsheet-wrapper" id="printable-area">
                        <h2 class="broadsheet-title" id="broadsheet-title">MATOKEO YA MTIHANI</h2>
                        <div class="table-responsive">
                            <table class="broadsheet-table">
                                <thead>
                                    <tr>
                                        <th>Nafasi</th>
                                        <th>Adm No</th>
                                        <th>Jina la Mwanafunzi</th>
                                        <th>Jinsia</th>
                                        <th>Alama</th>
                                        <th>Pointi</th>
                                        <th>Wastani (GPA)</th>
                                        <th>Divisheni</th>
                                    </tr>
                                </thead>
                                <tbody id="broadsheet-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
