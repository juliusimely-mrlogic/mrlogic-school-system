<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walimu - M-Logic</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f3f4f6; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    
    /* Header Styles */
    .page-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px; margin-bottom: 25px; }
    .page-header h1 { color: #1e3a8a; margin: 0; font-size: 24px; }
    
    /* Button Styles */
    .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; text-decoration: none; display: inline-block; transition: 0.2s; text-align: center; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #059669; color: #fff; }
    .btn-success:hover { background: #047857; }
    .btn-secondary { background: #6b7280; color: #fff; }
    .btn-secondary:hover { background: #4b5563; }
    .btn-edit { background: #f59e0b; color: #fff; padding: 6px 12px; font-size: 13px;}
    .btn-edit:hover { background: #d97706; }
    .btn-delete { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 13px;}
    .btn-delete:hover { background: #dc2626; }
    
    /* Form Styles */
    .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
    .form-group { flex: 1; min-width: 200px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; color: #4b5563; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; }
    
    /* Table Styles */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
    th { background: #f9fafb; font-weight: 600; color: #374151; }
    tr:hover { background: #f9fafb; }

    /* Alert Styles */
    .alert { padding: 15px; border-radius: 4px; margin-bottom: 20px; display: none; }
    .alert-success { background: #d1fae5; color: #065f46; }
    .alert-danger { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Kichwa cha Ukurasa na Kitufe cha Kurudi -->
    <div class="page-header">
      <h1>Usajili na Usimamizi wa Walimu</h1>
      <a href="/" class="btn btn-secondary">⬅️ Rudi Dashibodi</a>
    </div>
    
    <div id="alert-box" class="alert"></div>

    <!-- Fomu (Inatumika kwa Kusajili na Kurekebisha) -->
    <form id="teacher-form" style="background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0;">
      <!-- ID iliyofichwa kwa ajili ya kurekebisha -->
      <input type="hidden" id="teacher-id" value="" />

      <div class="form-row">
        <div class="form-group">
          <label>Jina Kamili:</label>
          <input type="text" id="full_name" required placeholder="Mfano: John Doe" />
        </div>
        <div class="form-group">
          <label>Jinsia:</label>
          <select id="gender" required>
            <option value="M">Me (M)</option>
            <option value="F">Ke (F)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Namba ya Simu:</label>
          <input type="text" id="phone" required placeholder="Mfano: 0712345678" />
        </div>
        <div class="form-group">
          <label>Jukumu / Wadhifa:</label>
          <select id="designation" required>
            <option value="Mwalimu">Mwalimu</option>
            <option value="Mtaaluma">Mtaaluma (Academic)</option>
            <option value="Mhasibu wa Shule">Mhasibu wa Shule (Bursar)</option>
            <option value="Mwalimu wa Nidhamu">Mwalimu wa Nidhamu (Discipline)</option>
            <option value="Makamu Mkuu wa Shule">Makamu Mkuu wa Shule (Second Master)</option>
            <option value="Meneja wa Shule">Meneja wa Shule (Manager)</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group" style="display: flex; gap: 10px; align-items: flex-end;">
          <button type="submit" id="submit-btn" class="btn btn-primary" style="flex: 1;">Sajili Mwalimu Mpya</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none; flex: 1;">Ghairi Marekebisho</button>
        </div>
      </div>
    </form>

    <!-- Jedwali la Walimu -->
    <h2 style="color: #374151; font-size: 18px; margin-top: 30px;">Orodha ya Walimu</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Jina Kamili</th>
          <th>Jinsia</th>
          <th>Simu</th>
          <th>Jukumu</th>
          <th>Username</th>
          <th>Vitendo</th>
        </tr>
      </thead>
      <tbody id="teachers-table-body">
        <!-- Data itaingia hapa kupitia JavaScript -->
      </tbody>
    </table>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      if (!token) {
        alert("Tafadhali ingia (login) kwanza.");
        window.location.href = '/';
        return;
      }

      const teacherForm = document.getElementById('teacher-form');
      const tableBody = document.getElementById('teachers-table-body');
      const alertBox = document.getElementById('alert-box');
      const submitBtn = document.getElementById('submit-btn');
      const cancelBtn = document.getElementById('cancel-btn');
      const teacherIdField = document.getElementById('teacher-id');
      
      let allTeachers = []; // Tutahifadhi walimu hapa kwa ajili ya kurekebisha

      const authHeaders = {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      };

      // 1. Kazi ya kuonyesha tahadhari (Alert)
      function showAlert(message, type = 'success') {
        alertBox.textContent = message;
        alertBox.className = `alert alert-${type}`;
        alertBox.style.display = 'block';
        setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
      }

      // 2. Vuta Walimu kutoka Server
      async function loadTeachers() {
        try {
          const res = await fetch('/api/teachers', { headers: authHeaders });
          const teachers = await res.json();
          
          if (!res.ok) throw new Error(teachers.error || "Imeshindikana kupata walimu");

          allTeachers = teachers; // Hifadhi data kwa ajili ya matumizi mengine
          tableBody.innerHTML = '';
          
          if (teachers.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Hakuna walimu waliosajiliwa bado.</td></tr>';
            return;
          }

          teachers.forEach((teacher, index) => {
            tableBody.innerHTML += `
              <tr>
                <td>${index + 1}</td>
                <td><strong>${teacher.full_name}</strong></td>
                <td>${teacher.gender}</td>
                <td>${teacher.phone || '-'}</td>
                <td><span style="background:#e0e7ff; color:#3730a3; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:bold;">${teacher.designation || 'Mwalimu'}</span></td>
                <td>${teacher.username || '-'}</td>
                <td>
                  <button class="btn btn-edit" onclick="prepareEdit(${teacher.id})">✏️ Rekebisha</button>
                  <button class="btn btn-delete" onclick="deleteTeacher(${teacher.id})">🗑️ Futa</button>
                </td>
              </tr>
            `;
          });
        } catch (error) {
          showAlert(error.message, 'danger');
        }
      }

      // 3. Andaa Fomu kwa ajili ya Kurekebisha (Edit)
      window.prepareEdit = function(id) {
        const teacher = allTeachers.find(t => t.id === id);
        if (!teacher) return;

        // Jaza fomu na taarifa za mwalimu
        teacherIdField.value = teacher.id;
        document.getElementById('full_name').value = teacher.full_name;
        document.getElementById('gender').value = teacher.gender;
        document.getElementById('phone').value = teacher.phone || '';
        document.getElementById('designation').value = teacher.designation || 'Mwalimu';

        // Badilisha mwonekano wa vitufe
        submitBtn.textContent = 'Hifadhi Marekebisho';
        submitBtn.className = 'btn btn-success'; // Badilisha rangi kuwa ya kijani
        cancelBtn.style.display = 'block'; // Onyesha kitufe cha kughairi

        // Peleka mtumiaji juu kwenye fomu
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // 4. Futa Mwalimu (Delete)
      window.deleteTeacher = async function(id) {
        if (!confirm("Je, una uhakika unataka kumfuta mwalimu huyu? Kitendo hiki hakiwezi kurudishwa.")) {
          return;
        }

        try {
          const res = await fetch(`/api/teachers/${id}`, {
            method: 'DELETE',
            headers: authHeaders
          });
          const result = await res.json();

          if (!res.ok) throw new Error(result.error || "Imeshindikana kufuta");

          showAlert("Mwalimu amefutwa kikamilifu.", "success");
          loadTeachers(); // Rejesha jedwali jipya

        } catch (error) {
          showAlert(error.message, 'danger');
        }
      };

      // 5. Ghairi Marekebisho (Rudisha fomu kwenye hali ya kawaida)
      cancelBtn.addEventListener('click', () => {
        teacherForm.reset();
        teacherIdField.value = '';
        submitBtn.textContent = 'Sajili Mwalimu Mpya';
        submitBtn.className = 'btn btn-primary';
        cancelBtn.style.display = 'none';
      });

      // 6. Tuma Fomu (Inashughulikia POST mpya na PUT ya kurekebisha)
      teacherForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = teacherIdField.value;
        const teacherData = {
          full_name: document.getElementById('full_name').value,
          gender: document.getElementById('gender').value,
          phone: document.getElementById('phone').value,
          designation: document.getElementById('designation').value
        };

        // Kama kuna ID, tunarekebisha (PUT). Kama hakuna, tunasajili mpya (POST)
        const url = id ? `/api/teachers/${id}` : '/api/teachers';
        const method = id ? 'PUT' : 'POST';

        try {
          const res = await fetch(url, {
            method: method,
            headers: authHeaders,
            body: JSON.stringify(teacherData)
          });
          const result = await res.json();

          if (!res.ok) throw new Error(result.error || "Imeshindikana kuhifadhi");

          if (id) {
            showAlert(`Taarifa za mwalimu ${result.full_name} zimefanyiwa marekebisho!`);
          } else {
            showAlert(`Mwalimu ${result.full_name} amesajiliwa kikamilifu! Username: ${result.username}`);
          }
          
          cancelBtn.click(); // Safisha fomu na urudishe vitufe kwenye hali ya kawaida
          loadTeachers(); // Rejesha jedwali jipya

        } catch (error) {
          showAlert(error.message, 'danger');
        }
      });

      // Anzisha mfumo
      loadTeachers();
    });
  </script>
</body>
</html>
