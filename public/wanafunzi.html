<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><title>Wanafunzi</title>
<style>body{font-family:sans-serif;background:#f3f4f6;padding:20px;} .container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:8px;} .header{display:flex;justify-content:space-between;margin-bottom:20px;} table{width:100%;border-collapse:collapse;margin-top:15px;} th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;} input,select{padding:8px;margin:5px 0;width:100%;box-sizing:border-box;} .btn{background:#2563eb;color:#fff;padding:10px 15px;text-decoration:none;border-radius:4px;border:none;cursor:pointer;} .btn-red{background:#dc2626;}</style></head>
<body><div class="container"><div class="header"><h2>Wanafunzi</h2><a href="/" class="btn">⬅️ Rudi</a></div>
<form id="frm"><input type="text" id="name" placeholder="Jina Kamili" required><select id="gender"><option value="M">Me</option><option value="F">Ke</option></select><input type="text" id="adm" placeholder="Namba ya Usajili" required><select id="stream" required><option value="">Chagua Darasa</option></select><button class="btn" type="submit">Sajili Mwanafunzi</button></form>
<table><thead><tr><th>Jina</th><th>Darasa</th><th>Jinsia</th><th>Namba</th><th>Futa</th></tr></thead><tbody id="tbl"></tbody></table></div>
<script>
const token=localStorage.getItem('token'); const h={'Authorization':`Bearer ${token}`};
async function load(){ const [r1,r2]=await Promise.all([fetch('/api/students',{headers:h}),fetch('/api/streams',{headers:h})]); const studs=await r1.json(), streams=await r2.json(); document.getElementById('stream').innerHTML='<option value="">Chagua Darasa</option>'+streams.map(s=>`<option value="${s.id}">${s.name}</option>`).join(''); document.getElementById('tbl').innerHTML=studs.map(s=>`<tr><td>${s.full_name}</td><td>${streams.find(x=>x.id===s.stream_id)?.name||'-'}</td><td>${s.gender}</td><td>${s.admission_number}</td><td><button onclick="del(${s.id})" class="btn btn-red">Futa</button></td></tr>`).join(''); }
document.getElementById('frm').onsubmit=async(e)=>{e.preventDefault(); await fetch('/api/students',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({full_name:name.value,gender:gender.value,admission_number:adm.value,stream_id:stream.value})}); location.reload();};
window.del=async(id)=>{if(confirm('Futa?')){await fetch('/api/students/'+id,{method:'DELETE',headers:h});load();}};
load();
</script></body></html>
